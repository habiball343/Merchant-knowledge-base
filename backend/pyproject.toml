[project]
name = "merchant-knowledge-base"
version = "1.0.0"
description = "掌柜智库：面向商品资料的检索增强问答（RAG）知识库"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "loguru>=0.7,<1",
    "mcp>=1.12,<2",
    "pydantic-settings>=2.6,<3",
    "pymilvus>=2.5.4,<2.6",
    "pymongo>=4.10,<5",
    "pymupdf4llm>=0.0.17,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
